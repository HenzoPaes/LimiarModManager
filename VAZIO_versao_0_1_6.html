<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LIMIAR — Arquitetura do Vazio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--fg:#ebe6da;--dim:#9a9385;--line:rgba(235,230,218,.30);--bg:#050505}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--fg);overflow:hidden;
  font-family:"Helvetica Neue",Helvetica,"Segoe UI",Roboto,Arial,sans-serif;font-weight:300;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000;outline:none}
.hidden{display:none !important}
.panel{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#veil{position:fixed;left:0;top:0;right:0;bottom:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
#loading{background:#000;flex-direction:column;z-index:40;text-align:center}
#loading .brand{letter-spacing:.7em;font-size:15px;color:var(--dim);margin-bottom:34px;padding-left:.7em}
#loadMsg{font-size:13px;letter-spacing:.12em;color:var(--fg);min-height:20px}
#loadSub{font-size:11px;color:var(--dim);margin-top:10px;min-height:16px;max-width:80vw}
.bar{width:min(260px,60vw);height:1px;background:rgba(255,255,255,.14);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .25s ease}
#menu{background:radial-gradient(ellipse at center,rgba(0,0,0,.66) 0%,rgba(0,0,0,.52) 55%,rgba(0,0,0,.78) 100%);z-index:30}
#menu .menuInner{text-shadow:0 1px 14px rgba(0,0,0,.9)}
.menuInner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px;max-height:100%;overflow:auto}
.menuInner h1{margin:0;font-weight:200;letter-spacing:.62em;padding-left:.62em;font-size:clamp(30px,7vw,68px)}
.menuInner h2{margin:0 0 26px;font-weight:300;letter-spacing:.5em;padding-left:.5em;font-size:clamp(10px,1.8vw,15px);color:var(--dim)}
.btn{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;letter-spacing:.34em;padding:16px 26px 16px 30px;min-width:min(280px,78vw);min-height:50px;
  color:var(--fg);background:rgba(0,0,0,.38);border:1px solid var(--line);cursor:pointer;text-transform:uppercase;touch-action:manipulation}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:active{background:rgba(255,255,255,.16)}
.btn.small{min-width:0;padding:12px 18px;letter-spacing:.2em;font-size:12px}
.hint{font-size:11px;color:#b5ae9f;letter-spacing:.08em;line-height:1.7;max-width:min(440px,86vw);margin:14px 0 0}
#settings,#pause,#endscreen{background:rgba(0,0,0,.84);z-index:32}
.sheet{width:min(560px,94vw);max-height:92%;overflow:auto;padding:22px 20px 26px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet h3{margin:0 0 18px;font-weight:300;letter-spacing:.42em;font-size:14px;text-align:center;color:var(--fg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;letter-spacing:.05em}
.row label{flex:1 1 auto;color:var(--fg)}
.row .val{min-width:44px;text-align:right;color:var(--dim);font-size:12px}
.row select{flex:0 0 150px;background:#0b0b0b;color:var(--fg);border:1px solid var(--line);padding:10px 8px;font:inherit;font-size:13px}
.row input[type=range]{flex:0 0 150px;accent-color:#d8d2c2;height:30px;touch-action:pan-y}
.row input[type=checkbox]{width:26px;height:26px;accent-color:#d8d2c2}
.sheet .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
#pause .menuInner{gap:12px}
#pause h3{margin:0 0 14px;font-weight:300;letter-spacing:.5em;padding-left:.5em;font-size:15px}
#endscreen{flex-direction:column;background:#fff;color:#2a261f}
#endscreen h2{font-weight:200;letter-spacing:.7em;padding-left:.7em;margin:0 0 10px;font-size:clamp(22px,5vw,40px)}
#endscreen p{color:#6f695d;letter-spacing:.12em;font-size:12px;margin:0 0 30px}
#endscreen .btn{color:#2a261f;border-color:rgba(0,0,0,.35);background:rgba(255,255,255,.4)}
#endscreen.dead{background:#050000;color:#c9bcb4}#endscreen.dead p{color:#8a4a44}#endscreen.dead .btn{color:#c9bcb4;border-color:rgba(200,120,110,.4);background:rgba(120,0,0,.25)}
#touch{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;pointer-events:none}
#lookZone{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:auto;touch-action:none}
#joyZone{position:absolute;left:0;bottom:0;width:46%;height:66%;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:calc(28px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.035);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.34)}
#btnPause{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.28);color:rgba(255,255,255,.78);font-size:12px;letter-spacing:0;pointer-events:auto;touch-action:manipulation;cursor:pointer}
#diag{position:fixed;left:8px;top:8px;z-index:60;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#cfe;background:rgba(0,0,0,.66);
  padding:8px 10px;max-width:min(560px,94vw);max-height:80%;overflow:hidden;pointer-events:none;white-space:pre-wrap;border:1px solid rgba(255,255,255,.12)}
#errbox{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:18px}
#errbox .card{max-width:min(620px,94vw);max-height:92%;overflow:auto;border:1px solid var(--line);padding:22px 22px 26px;touch-action:pan-y}
#errbox h3{margin:0 0 12px;font-weight:300;letter-spacing:.2em;font-size:15px}
#errbox p,#errbox li{font-size:13px;line-height:1.65;color:#cfc9bb;letter-spacing:.02em}
#errbox pre{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#9fb;white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.05);padding:10px;margin:12px 0;max-height:160px;overflow:auto}
#errbox .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;font-size:12px;letter-spacing:.1em;color:var(--fg);
  background:rgba(0,0,0,.6);padding:10px 16px;border:1px solid rgba(255,255,255,.14);opacity:0;transition:opacity .5s ease;pointer-events:none;max-width:88vw;text-align:center}

#servers,#create,#room{background:rgba(0,0,0,.86);z-index:33}
.srv{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;cursor:pointer}
.srv.sel{background:rgba(255,255,255,.1)}.srv i{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.1em}
.row input[type=text]{flex:0 0 170px;min-width:0;background:#0b0b0b;color:var(--fg);border:1px solid var(--line);padding:10px 8px;font:inherit;font-size:13px;-webkit-user-select:text;user-select:text}
#mpStatus{text-align:center}#mpStatus::before{content:"\25CF  ";color:#fb8}#mpStatus[data-s=on]::before{color:#7e9}
#netDot{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));z-index:12;font-size:11px;letter-spacing:.12em;color:#9fd;pointer-events:none}
#netDot[data-s=wait],#netDot[data-s=off]{color:#fb8}
#vhsStamp{position:fixed;left:calc(20px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));z-index:12;font:16px ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 0 5px rgba(255,255,255,.7);pointer-events:none;letter-spacing:.08em}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.34);color:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0;padding:0}
.tb svg{width:56%;height:56%}.tb.on{background:rgba(255,240,200,.3);border-color:#fff}
#btnRun{right:calc(26px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:84px;height:84px}
#btnLamp{right:calc(124px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:62px;height:62px}
#btnVhs{right:calc(36px + env(safe-area-inset-right));bottom:calc(134px + env(safe-area-inset-bottom));width:52px;height:52px}
#btnTpv{right:calc(104px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));width:44px;height:44px}

#zoomUI{position:fixed;left:0;top:0;right:0;bottom:0;z-index:11;pointer-events:none}
#zoomUI .zb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1px solid rgba(255,255,255,.34);background:rgba(0,0,0,.4);color:#eee;display:flex;align-items:center;justify-content:center;font:600 24px/1 monospace;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
#btnZoom{right:calc(198px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:56px;height:56px}
#btnZoom svg{width:56%;height:56%}
#zoomUI:not(.tch) #btnZoom{display:none}
#zoomUI.zon #btnZoom{background:rgba(255,240,200,.3);border-color:#fff}
#zPanel{display:none}#zoomUI.zon.tch #zPanel{display:block}
#zIn,#zOut,#zX{right:calc(16px + env(safe-area-inset-right));width:54px;height:54px}
#zIn{top:calc(50% - 96px)}#zOut{top:calc(50% - 27px)}#zX{top:calc(50% + 42px);color:#e6a0a0}
#zoomNoise,#zoomVig{position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;pointer-events:none;transition:opacity .35s}
#zoomVig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#zoomHud{position:absolute;left:calc(16px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));font:600 14px monospace;color:#f2e6d4;letter-spacing:1px;text-shadow:0 0 4px #000;opacity:.88}
#treeHud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9;font:600 15px monospace;color:#e8d8c8;letter-spacing:1px;opacity:.6;text-shadow:0 0 4px #000;pointer-events:none}
</style>
</head>
<body>
<noscript><p style="color:#ddd;font-family:sans-serif;padding:24px">LIMIAR precisa de JavaScript para funcionar.</p></noscript>
<canvas id="gl" tabindex="-1"></canvas>
<div id="veil"></div>

<section id="loading" class="panel">
  <div class="brand">LIMIAR</div>
  <div id="loadMsg">Iniciando…</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadSub"></div>
</section>

<section id="menu" class="panel hidden">
  <div class="menuInner">
    <h1>LIMIAR</h1>
    <h2>ARQUITETURA DO VAZIO</h2>
    <button class="btn" id="btnStart">Iniciar</button>
    <button class="btn" id="btnContinue" hidden>Continuar</button>
    <button class="btn" id="btnServers">Servidores</button>
    <button class="btn" id="btnSettings">Configurações</button>
    <p class="hint" id="menuHint"></p>
  </div>
</section>

<section id="settings" class="panel hidden">
  <div class="sheet">
    <h3>CONFIGURAÇÕES</h3>
    <div class="row"><label for="sQuality">Qualidade gráfica</label>
      <select id="sQuality"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option><option value="ultra">Ultra</option></select></div>
    <div class="row"><label for="sScale">Resolução interna</label><input id="sScale" type="range" min="50" max="125" step="5"><span class="val" id="vScale"></span></div>
    <div class="row"><label for="sShadows">Sombras</label>
      <select id="sShadows"><option value="off">Desligadas</option><option value="mid">Médias</option><option value="high">Altas</option></select></div>
    <div class="row"><label for="sRefl">Reflexos</label>
      <select id="sRefl"><option value="simple">Simples</option><option value="mid">Médios</option><option value="adv">Avançados</option></select></div>
    <div class="row"><label for="sBloom">Brilho (bloom)</label>
      <select id="sBloom"><option value="off">Desligado</option><option value="low">Baixo</option><option value="high">Alto</option></select></div>
    <div class="row"><label for="sMouse">Sensibilidade do mouse</label><input id="sMouse" type="range" min="30" max="250" step="5"><span class="val" id="vMouse"></span></div>
    <div class="row"><label for="sTouch">Sensibilidade do toque</label><input id="sTouch" type="range" min="30" max="250" step="5"><span class="val" id="vTouch"></span></div>
    <div class="row"><label for="sFov">Campo de visão</label><input id="sFov" type="range" min="55" max="95" step="1"><span class="val" id="vFov"></span></div>
    <div class="row"><label for="sVol">Volume geral</label><input id="sVol" type="range" min="0" max="100" step="1"><span class="val" id="vVol"></span></div>
    <div class="row"><label for="sAmb">Volume do ambiente</label><input id="sAmb" type="range" min="0" max="100" step="1"><span class="val" id="vAmb"></span></div>
    <div class="row"><label for="sMusic">Música ambiente</label><input id="sMusic" type="checkbox"></div>
    <div class="row"><label for="sReduce">Reduzir movimento de câmera</label><input id="sReduce" type="checkbox"></div>
    <div class="row"><label for="sLimit">Limitar efeitos de pós-processamento</label><input id="sLimit" type="checkbox"></div>
    <div class="row"><label for="sAA">Anti-aliasing</label>
      <select id="sAA"><option value="off">Desligado</option><option value="low">Baixo (FXAA)</option><option value="med">Médio (MSAA 2×)</option><option value="high">Alto (MSAA 4×)</option></select></div>
    <div class="row"><label for="sLampQ">Qualidade da lanterna</label>
      <select id="sLampQ"><option value="low">Baixa</option><option value="mid">Média (sombras)</option><option value="high">Alta (núcleo + sombras)</option></select></div>
    <div class="row"><label for="sSway">Balanço da câmera</label><input id="sSway" type="range" min="0" max="150" step="5"><span class="val" id="vSway"></span></div>
    <div class="row"><label for="sIdle">Movimento de inatividade</label><input id="sIdle" type="range" min="0" max="150" step="5"><span class="val" id="vIdle"></span></div>
    <div class="row"><label for="sRev">Reverberação ambiental</label><input id="sRev" type="range" min="0" max="150" step="5"><span class="val" id="vRev"></span></div>
    <div class="btns">
      <button class="btn small" id="btnDefaults">Restaurar padrões</button>
      <button class="btn small" id="btnSettingsBack">Voltar</button>
    </div>
  </div>
</section>

<section id="servers" class="panel hidden"><div class="sheet">
  <h3>SERVIDORES</h3>
  <div class="row"><label for="mpName">Seu nome</label><input type="text" id="mpName" maxlength="16" autocomplete="off"></div>
  <div class="row"><label for="mpUrl">Servidor</label><input type="text" id="mpUrl" placeholder="wss://seu-servidor…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="btns" style="margin-top:12px"><button class="btn small" id="btnConnect">Conectar</button><button class="btn small" id="btnTest">Testar conexão</button></div>
  <p class="hint" id="mpStatus" style="margin:10px auto"></p>
  <div id="roomList"></div>
  <div class="row"><label for="mpCode">Código da sala</label><input type="text" id="mpCode" maxlength="6" autocomplete="off" autocapitalize="characters" style="flex-basis:110px;text-transform:uppercase"><button class="btn small" id="btnJoinCode">Entrar</button></div>
  <div class="btns"><button class="btn small" id="btnRefresh">Atualizar</button><button class="btn small" id="btnJoin">Entrar na selecionada</button><button class="btn small" id="btnCreate">Criar sala</button><button class="btn small" id="btnSrvBack">Voltar</button></div>
</div></section>
<section id="create" class="panel hidden"><div class="sheet">
  <h3>CRIAR SALA</h3>
  <div class="row"><label for="crName">Nome da sala</label><input type="text" id="crName" maxlength="24" value="Sala"></div>
  <div class="row"><label for="crPriv">Visibilidade</label><select id="crPriv"><option value="0">Pública</option><option value="1">Privada (com código)</option></select></div>
  <div class="row"><label for="crMax">Limite de jogadores</label><select id="crMax"><option>2</option><option>4</option><option>6</option><option selected>8</option><option>12</option></select></div>
  <div class="row"><label for="crZone">Mapa (zona inicial)</label><select id="crZone"></select></div>
  <div class="btns"><button class="btn small" id="btnCreateGo">Criar</button><button class="btn small" id="btnCreateBack">Voltar</button></div>
</div></section>
<section id="room" class="panel hidden"><div class="sheet">
  <h3 id="rmTitle">SALA</h3>
  <div class="row"><label>Código da sala</label><b id="rmCode" style="letter-spacing:.35em;font-size:19px;font-weight:400"></b></div>
  <p class="hint" id="rmInfo" style="margin:10px auto;text-align:center"></p>
  <div id="rmPlayers"></div>
  <div class="btns"><button class="btn small" id="btnCopy">Copiar código</button><button class="btn small" id="btnShare">Compartilhar</button><button class="btn small" id="btnStartRoom">Iniciar partida</button><button class="btn small" id="btnCloseRoom">Encerrar sala</button><button class="btn small" id="btnLeaveRoom">Sair</button></div>
</div></section>
<section id="pause" class="panel hidden">
  <div class="menuInner">
    <h3 id="pauseTitle">PAUSA</h3>
    <button class="btn" id="btnResume">Retomar</button>
    <button class="btn" id="btnRestartZone">Reiniciar zona atual</button>
    <button class="btn" id="btnPauseSettings">Configurações</button>
    <button class="btn" id="btnToMenu">Voltar ao menu</button>
    <p class="hint" id="pauseHint"></p>
  </div>
</section>

<section id="endscreen" class="panel hidden">
  <h2>FIM</h2>
  <p>Você atravessou o vazio.</p>
  <button class="btn" id="btnEndAgain">Recomeçar</button>
  <div style="height:12px"></div>
  <button class="btn" id="btnEndMenu">Menu</button>
</section>

<div id="touch" class="hidden">
  <div id="lookZone"></div>
  <div id="joyZone"></div>
  <div id="joy"><div id="joyKnob"></div></div>
  <button id="btnPause" aria-label="Pausar">II</button>
  <button id="btnRun" class="tb" aria-label="Correr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4.5" r="1.8"/><path d="M12 8l-3 4 4 2 1 5M9 12l-4 1M13 14l-3 5M12 8l4 2 3-1"/></svg></button>
  <button id="btnLamp" class="tb" aria-label="Lanterna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 6H9zM9 9v12h6V9M12 12v3M4 4l2 1.5M20 4l-2 1.5"/></svg></button>
  <button id="btnVhs" class="tb" aria-label="Modo VHS">VHS</button>
  <button id="btnTpv" class="tb" aria-label="Câmera em terceira pessoa">3P</button>
</div>

<div id="treeHud" class="hidden"></div>
<div id="zoomUI" class="hidden"><div id="zoomVig"></div><div id="zoomNoise"></div><div id="zoomHud"></div>
<button id="btnZoom" class="zb" aria-label="Zoom da câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5M10.5 8v5M8 10.5h5"/></svg></button>
<div id="zPanel"><button id="zIn" class="zb" aria-label="Aumentar zoom">+</button><button id="zOut" class="zb" aria-label="Diminuir zoom">−</button><button id="zX" class="zb" aria-label="Fechar zoom">X</button></div></div>
<div id="diag" class="hidden"></div>
<div id="netDot"></div><div id="vhsStamp" class="hidden"></div>
<div id="toast"></div>

<div id="errbox" class="hidden">
  <div class="card">
    <h3 id="errTitle">Algo deu errado</h3>
    <p id="errText"></p>
    <pre id="errDetail"></pre>
    <ul id="errHints"></ul>
    <div class="btns">
      <button class="btn small" id="btnErrReload">Recarregar</button>
      <button class="btn small" id="btnErrSafe">Modo seguro (qualidade baixa)</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   LIMIAR — ARQUITETURA DO VAZIO
   Jogo de exploração 3D em primeira pessoa, arquivo único.
   Three.js (r128) via CDN. Toda geometria, textura e som são procedurais.
   ============================================================ */

const TEST = (typeof window !== 'undefined') && window.__LIMIAR_TEST__ === true;
const API = {};

    const to = setTimeout(() => { if (done) return; done = true; try { s.remove(); } catch (e) {} reject(new Error('tempo esgotado ao carregar ' + url)); }, timeoutMs || 20000);
    s.src = url; s.async = false; s.crossOrigin = 'anonymous';
    s.onload = () => { if (done) return; done = true; clearTimeout(to); resolve(url); };
    s.onerror = () => { if (done) return; done = true; clearTimeout(to); try { s.remove(); } catch (e) {} reject(new Error('falha ao carregar ' + url)); };
    document.head.appendChild(s);

}

const SKY_VERT = 'varying vec3 vDir;\nvoid main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }';

/* ---------- espelho planar (reflexo do piso/água) ---------- */
class PlanarMirror {
  constructor() {
    this.rt = null; this.cam = new THREE.PerspectiveCamera(); this.texMat = new THREE.Matrix4();
    this.plane = new THREE.Plane(); this.cp = new THREE.Vector4(); this.q = new THREE.Vector4();
    this.v1 = new THREE.Vector3(); this.v2 = new THREE.Vector3(); this.v3 = new THREE.Vector3(); this.n = new THREE.Vector3(0, 1, 0);
    this.w = 0; this.h = 0; this.type = null;
  }
  resize(w, h, type) {
    w = Math.max(16, w | 0); h = Math.max(16, h | 0);
    if (this.rt && this.w === w && this.h === h && this.type === type) return;
    if (this.rt) this.rt.dispose();
    this.w = w; this.h = h; this.type = type;
    this.rt = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: type, depthBuffer: true, stencilBuffer: false });
    this.rt.texture.generateMipmaps = false;
  }
  render(renderer, scene, camera, planeY) {
    camera.updateMatrixWorld();
    const cp = this.v1.setFromMatrixPosition(camera.matrixWorld);
    if (cp.y <= planeY + 0.03) return false;
    const vc = this.cam;
    const fwd = this.v2.set(0, 0, -1).transformDirection(camera.matrixWorld);
    const up = this.v3.set(0, 1, 0).transformDirection(camera.matrixWorld);
    vc.position.set(cp.x, 2 * planeY - cp.y, cp.z);
    vc.up.set(up.x, -up.y, up.z);
    vc.lookAt(vc.position.x + fwd.x, vc.position.y - fwd.y, vc.position.z + fwd.z);
    vc.near = camera.near; vc.far = camera.far;
    vc.updateMatrixWorld();
    vc.projectionMatrix.copy(camera.projectionMatrix);
    vc.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
    const tm = this.texMat;
    tm.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
    tm.multiply(vc.projectionMatrix); tm.multiply(vc.matrixWorldInverse);
    // plano de corte oblíquo (descarta tudo que está abaixo do piso)
    this.plane.set(this.n, -planeY);
    this.plane.applyMatrix4(vc.matrixWorldInverse);
    const c = this.cp.set(this.plane.normal.x, this.plane.normal.y, this.plane.normal.z, this.plane.constant);
    const pm = vc.projectionMatrix, e = pm.elements, q = this.q;
    q.x = (Math.sign(c.x) + e[8]) / e[0];
    q.y = (Math.sign(c.y) + e[9]) / e[5];
    q.z = -1.0;
    q.w = (1.0 + e[10]) / e[14];
    c.multiplyScalar(2.0 / c.dot(q));
    e[2] = c.x; e[6] = c.y; e[10] = c.z + 1.0 - 0.003; e[14] = c.w;
    const rt0 = renderer.getRenderTarget();
    renderer.setRenderTarget(this.rt);
    try { renderer.state.buffers.depth.setMask(true); } catch (err) {}
    renderer.render(scene, vc);
    renderer.setRenderTarget(rt0);
    return true;
  }
}

const POST_VERT = 'varying vec2 vUv;\nvoid main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

/* ---------- detecção de recursos ---------- */
Gfx.detectHDR = function () {

  const na = Math.max(1, Math.floor((a1 - a0) / pa)), ny = Math.max(1, Math.floor((y1 - y0) / py)), off = dir * 0.05;
  for (let j = 0; j < ny; j++) for (let i = 0; i < na; i++) {
    const ca = a0 + (i + 0.5) * ((a1 - a0) / na), cy = y0 + (j + 0.5) * ((y1 - y0) / ny);
    if (o.skip && o.skip(ca, cy)) continue;
    const lit = o.lit && rnd() < o.lit;
    const key = lit ? 'emit' : 'glass';
    let color;
    if (lit) { const cc = o.colors[Math.floor(rnd() * o.colors.length)]; const k = 0.7 + rnd() * 0.6; color = [cc[0] * k, cc[1] * k, cc[2] * k]; }
    if (axis === 'z') zb.quadZ(key, c + off, ca - ww / 2, ca + ww / 2, cy - wh / 2, cy + wh / 2, dir, color);
    else zb.quadX(key, c + off, cy - wh / 2, cy + wh / 2, ca - ww / 2, ca + ww / 2, dir, color);
  }
}
// pórtico em A: dois montantes inclinados
function aFrame(zb, zc, W, H, t, dz) {
  const a = W / 2, L = Math.hypot(a, H), ai = a - t * L / H, Hi = H - t * L / a, z0 = zc - dz / 2, z1 = zc + dz / 2;
  const left = [[-a, 0], [-ai, 0], [0, Hi], [0, H]], right = [[ai, 0], [a, 0], [0, H], [0, Hi]];
  zb.prismXY('white', left, z0, z1); zb.prismXY('white', right, z0, z1);
  zb.colPrismXY(left, z0, z1, 1.0, ''); zb.colPrismXY(right, z0, z1, 1.0, '');
}

  '  vec3 N = normalize(vWN);',

  '  vec3 R = reflect(V, N);',
  '  float ndv = clamp(dot(-V, N), 0.0, 1.0);',
  '  float F = uF0 + (1.0 - uF0) * pow(1.0 - ndv, 5.0);',
  '  vec3 env = textureCube(uEnv, R).rgb;',
  '  vec3 c = uBase + env * F * uBoost;',
  '  gl_FragColor = vec4(c, 1.0);',

function makeNoiseBuffer(ctx, seconds, brown) {
  const len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; } else d[i] = w;
  }
  return buf;
}
function makeIR(ctx, seconds, decay) {
  const len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < 300 ? i / 300 : 1); }
  }
  return buf;
}

/* ---------- construção do mundo ---------- */

  const defs = [
    [buildZone1, 'O ÁTRIO BRANCO'], [buildZone2, 'O VÃO E A PLANÍCIE'], [buildZone3, 'A FACHADA'], [buildZone4, 'A CÂMARA'], [buildZone5, 'O PÁTIO'],
    [buildZone6, 'OS CORREDORES'], [buildZone7, 'AS PASSARELAS'], [buildZone8, 'A ESCULTURA'], [buildZone9, 'O LIMIAR']

  let prev = null;
  for (let i = 0; i < defs.length; i++) {

    if (!TEST) await nextFrame();
    const zb = newZone(i, defs[i][1], prev);
    defs[i][0](zb, rng(1000 + i * 17));

/* ---------- jogador ---------- */
function zoneSpawn(i) { const z = World.zones[i], s = z.spawn, w = z.W(s.x, s.y, s.z); return { x: w[0], y: w[1], z: w[2], yaw: s.yaw }; }

/* ---------- luzes dinâmicas (conjunto rotativo) ---------- */
const LP = { acc: 99 };
function updateLightPool(dt) {

    LP.acc = 0;
    const px = P.x, py = P.y + 1.2, pz = P.z, cand = [];
    for (let i = 0; i < A.length; i++) {
      const a = A[i], d = Math.sqrt((a.x - px) * (a.x - px) + (a.y - py) * (a.y - py) * 0.5 + (a.z - pz) * (a.z - pz));
      if (d < a.d * 1.2) cand.push([i, d / a.d]);
    }
    cand.sort((u, v) => u[1] - v[1]);
    const want = cand.slice(0, pool.length).map((c) => c[0]), used = {};
    pool.forEach((l, s) => { if (want.indexOf(l.userData.anchor) >= 0) { used[l.userData.anchor] = true; l.userData.want = l.userData.anchor; } else l.userData.want = -2; });
    want.forEach((ai) => {
      if (used[ai]) return;
      for (let s = 0; s < pool.length; s++) { const u = pool[s].userData; if (u.want === -2 || u.anchor === -1) { u.want = ai; used[ai] = true; break; } }
    });
  }
  for (let s = 0; s < pool.length; s++) {
    const l = pool[s], u = l.userData;
    if (u.want !== u.anchor) {

        u.anchor = u.want;
        if (u.anchor >= 0) { const a = A[u.anchor]; l.position.set(a.x, a.y, a.z); l.color.setRGB(a.color[0], a.color[1], a.color[2]); l.distance = a.d; }
      }

}

function updateEnding(dt) {

  World.col.resolve(q, P.y, PLAYER_R, PLAYER_H); P.x = q.x; P.z = q.z; P.speed = fwdSpeed;
  P.pitch = damp(P.pitch, 0.08, 0.4, dt);
  const f = clamp(T / 14, 0, 1), dist = lerp(Game.endD0, 3.6, Math.pow(f, 1.7));

/* ---------- detector de quadro preto (proteção contra GPUs/drivers problemáticos) ---------- */
